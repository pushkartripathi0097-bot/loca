            letter-spacing: 0.8px;
        }
        .screenshots-grid {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 24px;

        .screenshots-grid::-webkit-scrollbar {

        .screenshot-card {
            flex: 0 0 130px;
            border-radius: 12px;

        .screenshot-card img {

            height: auto;
            display: block;

            border-radius: 12px;

        .btn:hover {
